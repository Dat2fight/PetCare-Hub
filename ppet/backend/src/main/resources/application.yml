spring:
  application:
    name: petcarehub-backend
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=petcarehub;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${DB_USERNAME}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${DB_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
