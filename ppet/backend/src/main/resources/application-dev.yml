spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/petcarehub
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Datblc123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:petcarehub-dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.petcarehub: DEBUG
    org.springframework.security: DEBUG
