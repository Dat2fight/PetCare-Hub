# Automated tests only: ephemeral fake signing key; never package this profile with the application.
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: test-only-${random.value}${random.value}${random.value}${random.value}
    expiration-ms: 3600000
    refresh-expiration: 86400000
  cors:
    allowed-origins: http://localhost:5173
