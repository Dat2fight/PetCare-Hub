spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 123456
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: test-secret-key-for-testing-purposes-only-must-be-256-bits-long
    expiration: 3600000
    refresh-expiration: 86400000
  cors:
    allowed-origins: http://localhost:5173
