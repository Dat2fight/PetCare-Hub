name: Deploy PetCare Hub to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Build Frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
        run: |
          # Pages has no API proxy. These are public build URLs, never credentials.
          case "$VITE_API_BASE_URL" in https://*) ;; *) echo "Set VITE_API_BASE_URL to the HTTPS API URL in repository variables"; exit 1;; esac
          case "$VITE_WS_URL" in https://*) ;; *) echo "Set VITE_WS_URL to the HTTPS SockJS URL in repository variables"; exit 1;; esac
          cd ppet/frontend
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ppet/frontend/dist
          publish_branch: gh-pages
